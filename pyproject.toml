[project]
name = "cnfn-builder"
version = "0.1.0"
description = "A compliant builder for auditable Chinese-topic multimodal fake-news datasets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "llfzzz" }]

[project.scripts]
cnfn-builder = "cnfn_builder.cli:main"

[project.optional-dependencies]
capture = ["playwright>=1.40"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
